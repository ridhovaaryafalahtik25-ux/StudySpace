</head>
<body data-page="timer">
<header class="topbar">
<a class="logo" href="index.html">StudySpace</a>
  <form class="search" role="search" onsubmit="return false">
    <input type="search" placeholder="Cari" aria-label="Cari">

</header>
<div class="shell">
  <nav class="sidebar" aria-label="Navigasi utama">
      <a href="index.html" title="Beranda" aria-label="Beranda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 10.5 12 3l9 7.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></a>
      <a href="timer.html" aria-current="page" title="Timer" aria-label="Timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></a>
      <a href="planner.html" title="Calendar planner" aria-label="Calendar planner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></a>
      <a href="tips.html" title="Tips belajar" aria-label="Tips belajar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 18h6M10 22h4"/><path d="M15.1 14c.2-1 .7-1.7 1.4-2.5A4.7 4.7 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.4 2.5"/></svg></a>
      <hr>
      <a href="panduan.html" title="Panduan belajar" aria-label="Panduan belajar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></a>
      <a href="sumber.html" title="Sumber belajar" aria-label="Sumber belajar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></a>
    </nav>
  <main>
    <section class="view active" id="timer">
        <div class="panel">
          <h1 class="page-title">Timer</h1>
          <div class="timer-wrap">
            <div class="modes" role="group" aria-label="Mode timer">
              <button class="mode" data-mode="pomodoro" aria-pressed="true">Pomodoro</button>
              <button class="mode" data-mode="short" aria-pressed="false">Istirahat pendek</button>
              <button class="mode" data-mode="long" aria-pressed="false">Istirahat panjang</button>
            </div>
            <div class="clock" id="clock" role="timer" aria-live="off">25:00</div>
            <div class="controls">
              <button class="btn-main" id="startBtn">Mulai</button>
              <button class="icon-btn" id="resetBtn" aria-label="Atur ulang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></svg></button>
              <button class="icon-btn" id="setBtn" aria-label="Pengaturan" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg></button>
            </div>
            <div class="settings" id="settings">
              <label>Pomodoro (menit)<input type="number" min="1" max="120" id="inPomodoro" value="25"></label>
              <label>Istirahat pendek<input type="number" min="1" max="60" id="inShort" value="5"></label>
              <label>Istirahat panjang<input type="number" min="1" max="60" id="inLong" value="15"></label>
            </div>
          </div>
        </div>
      </section>
    <footer class="foot">© 2026 StudySpace · Belajar Lebih Terarah, Raih Hasil Lebih Baik.</footer>
  </main>
</div>
<script src="js/script.js"></script>
</body>
</html>
