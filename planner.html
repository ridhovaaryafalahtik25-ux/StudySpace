<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar Planner · StudySpace</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body data-page="planner">
  <header class="topbar">
    <a class="logo" href="index.html">StudySpace</a>
    <a class="avatar-btn" href="pengaturan.html" aria-label="Pengaturan" title="Pengaturan"><svg viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true" focusable="false">
        <path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4" />
      </svg></a>
  </header>
  <div class="shell">
    <nav class="sidebar" aria-label="Navigasi utama">
      <a href="index.html" title="Beranda" aria-label="Beranda"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
          focusable="false">
          <path d="M3 10.5 12 3l9 7.5V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <path d="M9 22V12h6v10" />
        </svg></a>
      <a href="timer.html" title="Timer" aria-label="Timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="10" />
          <path d="M12 6v6l4 2" />
        </svg></a>
      <a href="planner.html" aria-current="page" title="Calendar planner" aria-label="Calendar planner"><svg
          viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <path d="M16 2v4M8 2v4M3 10h18" />
        </svg></a>
      <hr>
      <a href="panduan.html" title="Panduan belajar" aria-label="Panduan belajar"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
          focusable="false">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
        </svg></a>
      <a href="sumber.html" title="Sumber belajar" aria-label="Sumber belajar"><svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
          focusable="false">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        </svg></a>
    </nav>
    <main>
      <section class="view active" id="planner">
        <div class="panel">
          <h1 class="page-title">Calendar Planner</h1>
          <div class="planner" id="plannerGrid"></div>
        </div>
        <!-- Tempel di planner.html, tepat SETELAH elemen <div id="plannerGrid"> (di dalam <main>) -->

        <section class="plan-tools" aria-label="Kelola jadwal">

          <!-- Form tambah jadwal -->
          <form id="planForm" class="plan-card">

            <h2>Tambah jadwal</h2>

            <div class="plan-fields">

              <label class="pf pf-wide">
                Kegiatan
                <input id="planTitle" type="text" maxlength="60" placeholder="Contoh: Belajar Kimia" required>
              </label>

              <label class="pf">
                Hari
                <select id="planDay">
                  <option value="0">Senin</option>
                  <option value="1">Selasa</option>
                  <option value="2">Rabu</option>
                  <option value="3">Kamis</option>
                  <option value="4">Jumat</option>
                  <option value="5">Sabtu</option>
                  <option value="6">Minggu</option>
                </select>
              </label>

              <label class="pf">
                Mulai
                <input id="planStart" type="time" value="08:00" required>
              </label>

              <label class="pf">
                Selesai
                <input id="planEnd" type="time" value="09:00" required>
              </label>

              <label class="pf">
                Warna
                <select id="planType">
                  <option value="a">Hijau</option>
                  <option value="b">Biru</option>
                </select>
              </label>

              <button class="plan-btn" type="submit">Tambah</button>

            </div>

            <p id="planMsg" class="plan-msg" role="status" aria-live="polite"></p>

          </form>

          <!-- Daftar jadwal (to-do) & riwayat -->
          <div class="plan-card">

            <div class="plan-tabs">
              <button id="tabPlan" type="button" aria-pressed="true">
                Jadwal <span id="countPlan">0</span>
              </button>
              <button id="tabHistory" type="button" aria-pressed="false">
                Riwayat <span id="countHistory">0</span>
              </button>
              <span id="planProgress" class="plan-progress"></span>
            </div>

            <ul id="planList" class="plan-list"></ul>

            <div id="historyWrap" hidden>
              <ul id="historyList" class="plan-list"></ul>
              <button id="clearHistory" type="button" class="plan-btn ghost">
                Hapus semua riwayat
              </button>
            </div>

          </div>

        </section>

      </section>
      <footer class="foot">© 2026 StudySpace · Belajar Lebih Terarah, Raih Hasil Lebih Baik.</footer>
    </main>
  </div>

  <script src="js/script.js"></script>

</body>

</html>
